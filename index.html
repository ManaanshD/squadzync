<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237C9CFF'/%3E%3Cpath d='M30 55 L45 68 L72 35' stroke='%230B0E1A' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getDatabase, ref, set, get, update, onValue, off, runTransaction
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
    getRedirectResult, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAqJw7ROh1nNU9lPhcU_Rwojbx6XQhcpW8",
    authDomain: "squadsyncmd.firebaseapp.com",
    databaseURL: "https://squadsyncmd-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "squadsyncmd",
    storageBucket: "squadsyncmd.firebasestorage.app",
    messagingSenderId: "790712054751",
    appId: "1:790712054751:web:3befeca96a3c336b5e0a6a"
  };

  let db = null, auth = null;
  try {
    const app = initializeApp(firebaseConfig);
    db = getDatabase(app);
    auth = getAuth(app);
  } catch (e) {
    console.warn('Firebase initialization error:', e);
  }

  window.__fbReady = !!db;
  const listeners = {};

  window.fbSetRaw = async (path, value) => {
    if (!db) throw new Error('Firebase not connected');
    await set(ref(db, path), value);
  };
  window.fbUpdateRaw = async (path, value) => {
    if (!db) throw new Error('Firebase not connected');
    await update(ref(db, path), value);
  };
  window.fbTxnRaw = async (path, updater) => {
    if (!db) throw new Error('Firebase not connected');
    return await runTransaction(ref(db, path), updater);
  };
  const MUTATION_QUEUE_KEY='squadzync:pending-firebase-mutations';
  const readMutationQueue=()=>{try{return JSON.parse(localStorage.getItem(MUTATION_QUEUE_KEY)||'[]')}catch(e){return[]}};
  const writeMutationQueue=q=>{try{localStorage.setItem(MUTATION_QUEUE_KEY,JSON.stringify(q.slice(-150)))}catch(e){}};
  const emitFirebaseError=(error,path,op)=>{try{window.dispatchEvent(new CustomEvent('squadzync:firebase-error',{detail:{error,path,op}}))}catch(e){}};
  const enqueueMutation=(op,path,value)=>{const q=readMutationQueue();q.push({id:Date.now()+'_'+Math.random().toString(36).slice(2,7),op,path,value,ts:Date.now()});writeMutationQueue(q);try{window.dispatchEvent(new CustomEvent('squadzync:sync-state',{detail:{state:'queued',count:q.length}}))}catch(e){}};
  window.__pendingMutationCount=()=>readMutationQueue().length;
  window.__flushFirebaseQueue=async()=>{if(!db||!navigator.onLine)return;let q=readMutationQueue();if(!q.length)return;try{window.dispatchEvent(new CustomEvent('squadzync:sync-state',{detail:{state:'syncing',count:q.length}}))}catch(e){}const remaining=[];for(const item of q){try{if(item.op==='set')await window.fbSetRaw(item.path,item.value);else await window.fbUpdateRaw(item.path,item.value)}catch(e){remaining.push(item);emitFirebaseError(e,item.path,item.op)}}writeMutationQueue(remaining);try{window.dispatchEvent(new CustomEvent('squadzync:sync-state',{detail:{state:remaining.length?'error':'live',count:remaining.length}}))}catch(e){}};
  window.fbSet=async(path,value)=>{if(!db)throw new Error('Firebase not connected');if(!navigator.onLine){enqueueMutation('set',path,value);return;}try{return await window.fbSetRaw(path,value)}catch(e){emitFirebaseError(e,path,'set');throw e}};
  window.fbUpdate=async(path,value)=>{if(!db)throw new Error('Firebase not connected');if(!navigator.onLine){enqueueMutation('update',path,value);return;}try{return await window.fbUpdateRaw(path,value)}catch(e){emitFirebaseError(e,path,'update');throw e}};
  window.fbTxn=async(path,updater)=>{if(!db||!navigator.onLine)throw new Error('Firebase transaction unavailable offline');try{return await window.fbTxnRaw(path,updater)}catch(e){emitFirebaseError(e,path,'transaction');throw e}};
  window.addEventListener('online',()=>window.__flushFirebaseQueue?.());
  window.addEventListener('offline',()=>{try{window.dispatchEvent(new CustomEvent('squadzync:sync-state',{detail:{state:'offline',count:window.__pendingMutationCount()}}))}catch(e){}});
  window.fbGet = async (path) => {
    if (!db) throw new Error('Firebase not connected');
    const snap = await get(ref(db, path));
    return snap.exists() ? snap.val() : null;
  };
  window.fbListen = (path, cb) => {
    if (!db) return () => {};
    if (listeners[path]) { off(ref(db, path)); delete listeners[path]; }
    const r = ref(db, path);
    onValue(r, (snap) => cb(snap.exists() ? snap.val() : null));
    listeners[path] = r;
    return () => { off(r); delete listeners[path]; };
  };

  const provider = new GoogleAuthProvider();
  window.__authReady = !!auth;

  window.fbSignIn = async () => {
    if (!auth) throw new Error('Auth not connected');
    try {
      const result = await signInWithPopup(auth, provider);
      return result.user;
    } catch (e) {
      if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/cancelled-popup-request' || e.code === 'auth/operation-not-supported-in-this-environment')) {
        await signInWithRedirect(auth, provider);
        return null;
      }
      throw e;
    }
  };
  window.fbEmailSignIn = async (email, password) => {
    if (!auth) throw new Error('Auth not connected');
    return (await signInWithEmailAndPassword(auth, email, password)).user;
  };
  window.fbEmailSignUp = async (email, password) => {
    if (!auth) throw new Error('Auth not connected');
    return (await createUserWithEmailAndPassword(auth, email, password)).user;
  };
  window.fbSignOut = async () => { if (auth) await signOut(auth); };

  // Signal that all Firebase bridge functions (fbSet/fbGet/fbUpdate/fbListen/
  // fbSignIn/fbSignOut) are now attached to window. The main app script waits
  // on this before booting, which fixes the "window.fbSet is not a function"
  // race — module scripts execute asynchronously/deferred relative to classic
  // scripts, so without this explicit gate the app could call window.fbSet
  // before this module finished running.
  window.__fbBridgeReady = true;
  if (window.__onFbBridgeReady) { window.__onFbBridgeReady(); window.__onFbBridgeReady = null; }

  window.__authUser = null;
  window.__authResolved = false;
  const authWaiters = [];
  window.__onAuthReady = (cb) => {
    if (window.__authResolved) cb(window.__authUser);
    else authWaiters.push(cb);
  };

  if (auth) {
    getRedirectResult(auth).catch(() => {});
    onAuthStateChanged(auth, (user) => {
      window.__authUser = user ? {
        uid: user.uid,
        name: user.displayName || 'Friend',
        email: user.email || '',
        photo: user.photoURL || ''
      } : null;
      window.__authResolved = true;
      if (authWaiters.length) { authWaiters.forEach(cb => cb(window.__authUser)); authWaiters.length = 0; }
      if (window.__onAuthChange) window.__onAuthChange(window.__authUser);
    });
  } else {
    window.__authResolved = true;
  }
</script>

<style>
:root{
  --bg-0:#0B0E1A;
  --glass:rgba(255,255,255,0.06);
  --glass-strong:rgba(255,255,255,0.10);
  --glass-border:rgba(255,255,255,0.12);
  --text-hi:#F5F6FA;
  --text-lo:#9BA0B4;
  --text-faint:#6B7086;
  --accent:#7C9CFF;
  --accent-2:#9B7CFF;
  --accent-rgb:124,156,255;
  --accent-soft:rgba(var(--accent-rgb),.14);
  --accent-glow:rgba(var(--accent-rgb),.28);
  --green:#4ADE80;
  --amber:#FBBF24;
  --red:#F87171;
  --grey:#9CA3AF;
  --radius-lg:26px;
  --radius-md:18px;
  --radius-sm:12px;
  --font-display:'Manrope',sans-serif;
  --font-body:'DM Sans',sans-serif;
  --ease-spring:cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-spring-soft:cubic-bezier(0.32, 1.28, 0.56, 1);
  --ease-out-ios:cubic-bezier(0.22, 1, 0.36, 1);
  --ease-sheet:cubic-bezier(0.32, 0.72, 0, 1);
}
body.theme-violet{ --accent:#9B7CFF; --accent-2:#C58CFF; --accent-rgb:155,124,255; }
body.theme-blue{ --accent:#5B9CFF; --accent-2:#7CC4FF; --accent-rgb:91,156,255; }
body.theme-green{ --accent:#4ADE80; --accent-2:#7CFFB2; --accent-rgb:74,222,128; }
body.theme-rose{ --accent:#FF7CA3; --accent-2:#FF9B7C; --accent-rgb:255,124,163; }
body.theme-amber{ --accent:#FBBF24; --accent-2:#FF9B4A; --accent-rgb:251,191,36; }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none;}
/* UI copy protection: normal text is not selectable. Explicit exceptions remain selectable. */
body, body *{
  -webkit-user-select:none;
  user-select:none;
}
input, textarea, select, [contenteditable=\"true\"], .selectable-code, .selectable-code *{
  -webkit-user-select:text;
  user-select:text;
}
.selectable-code{
  cursor:text;
  -webkit-touch-callout:text;
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
}
body{
  font-family:var(--font-body);
  color:var(--text-hi);
  background:
    radial-gradient(circle at 15% 0%, rgba(var(--accent-rgb),.18) 0%, transparent 45%),
    radial-gradient(circle at 90% 20%, color-mix(in srgb, var(--accent-2) 16%, transparent) 0%, transparent 40%),
    radial-gradient(circle at 50% 100%, rgba(var(--accent-rgb),.10) 0%, transparent 50%),
    var(--bg-0);
  background-attachment:fixed;
  min-height:100vh; min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  transition:background .4s ease;
}
body::before{
  content:'';
  position:fixed; inset:-20%;
  background:
    radial-gradient(circle at 30% 20%, rgba(var(--accent-rgb),.12), transparent 55%),
    radial-gradient(circle at 75% 75%, rgba(var(--accent-rgb),.08), transparent 50%);
  animation:ambient-drift 18s ease-in-out infinite alternate;
  pointer-events:none;
  z-index:0;
}
@keyframes ambient-drift{
  0%{transform:translate(0,0) scale(1);}
  100%{transform:translate(-2%,2%) scale(1.06);}
}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;padding-bottom:calc(120px + env(safe-area-inset-bottom));z-index:1;}

.hidden{display:none !important;}
/* Reliable inline SVG icons: no font/CSS dependency and no blank icons. */
.ti{display:inline-flex;align-items:center;justify-content:center;line-height:0;vertical-align:middle;}
.ti .icon,.icon{width:1em;height:1em;display:block;flex:0 0 auto;overflow:visible;}

/* Liquid glass: transparent, glossy and low-blur rather than frosted. */
:root{--group-accent:var(--accent);--group-accent-2:var(--accent-2);--group-accent-rgb:124,156,255;--liquid-alpha:.075;--liquid-blur:10px;--card-radius:18px;}
body.liquid-mode{--glass:rgba(255,255,255,var(--liquid-alpha));--glass-strong:rgba(255,255,255,.105);}
.glass,.glass-strong{border-radius:var(--card-radius);position:relative;overflow:hidden;}
.glass::before,.glass-strong::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.19),transparent 22%,transparent 68%,rgba(255,255,255,.05));opacity:.8;}
.glass::after,.glass-strong::after{content:"";position:absolute;inset:-35%;pointer-events:none;background:radial-gradient(circle at var(--mx,30%) var(--my,20%),rgba(255,255,255,.18),transparent 24%);mix-blend-mode:screen;opacity:.5;transition:opacity .25s ease;}
.liquid-sheen{position:relative;overflow:hidden;}
.liquid-sheen::after{content:"";position:absolute;top:-40%;left:-30%;width:45%;height:180%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);transform:rotate(22deg) translateX(-120%);animation:liquid-sweep 7s ease-in-out infinite;pointer-events:none;}
@keyframes liquid-sweep{0%,55%{transform:rotate(22deg) translateX(-140%)}70%,100%{transform:rotate(22deg) translateX(420%)}}
.parallax-target{--px:0px;--py:0px;--rx:0deg;--ry:0deg;transform:translate3d(var(--px),var(--py),0) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .16s cubic-bezier(.2,.75,.25,1);will-change:transform;}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at var(--pointer-x,50%) var(--pointer-y,20%),rgba(255,255,255,.045),transparent 24%);}
.glass{
  background:var(--glass);
  backdrop-filter:blur(var(--liquid-blur,26px)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--liquid-blur,26px)) saturate(160%);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-md);
  box-shadow:0 1px 0 rgba(255,255,255,0.05) inset, 0 8px 24px -12px rgba(0,0,0,0.5);
  transition:transform .38s var(--ease-spring), box-shadow .3s ease, background .3s ease;
}
.glass-strong{
  background:var(--glass-strong);
  backdrop-filter:blur(32px) saturate(170%);
  -webkit-backdrop-filter:blur(32px) saturate(170%);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-md);
  box-shadow:0 1px 0 rgba(255,255,255,0.07) inset, 0 12px 32px -14px rgba(0,0,0,0.55);
}
.btn{
  font-family:var(--font-display);
  font-weight:700;
  font-size:15px;
  color:var(--text-hi);
  background:var(--glass-strong);
  border:1px solid var(--glass-border);
  border-radius:16px;
  padding:15px 20px;
  cursor:pointer;
  transition:transform .42s var(--ease-spring), background .18s ease, filter .18s ease, box-shadow .3s ease;
  display:flex; align-items:center; justify-content:center; gap:8px;
  -webkit-user-select:none; user-select:none;
  will-change:transform;
}
.btn:active{transform:scale(0.945); background:rgba(255,255,255,0.16); transition:transform .1s var(--ease-out-ios), background .08s ease;}
.btn-primary{
  background:linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  border:none; color:#0B0E1A;
  box-shadow:0 10px 28px -10px var(--accent-glow), 0 1px 0 rgba(255,255,255,0.35) inset;
  transition:transform .42s var(--ease-spring), filter .18s ease, box-shadow .3s ease, background .4s ease;
}
.btn-primary:active{transform:scale(0.945); filter:brightness(1.08); transition:transform .1s var(--ease-out-ios), filter .08s ease;}
.btn-ghost{background:transparent; border:1px solid var(--glass-border);}
.btn-block{width:100%;}
.btn-google{
  background:#fff; color:#1f1f1f; border:1px solid rgba(0,0,0,0.08);
}
.btn-google:active{background:#f1f1f1;}
.btn[disabled]{opacity:.5; pointer-events:none;}

input[type=text], input[type=tel], input[type=url], input[type=search], input[type=email], input[type=password], select, textarea{
  width:100%;
  font-family:var(--font-body);
  font-size:16px;
  color:var(--text-hi);
  background:rgba(255,255,255,0.05);
  border:1px solid var(--glass-border);
  border-radius:14px;
  padding:13px 15px;
  outline:none;
  transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
}
input::placeholder, textarea::placeholder{color:var(--text-faint);}
input:focus, select:focus, textarea:focus{
  border-color:var(--accent);
  background:rgba(var(--accent-rgb),.09);
  box-shadow:0 0 0 4px rgba(var(--accent-rgb),.18);
}
label.field-label{font-size:12px; font-weight:600; color:var(--text-lo); text-transform:uppercase; letter-spacing:0.06em; margin:0 0 6px 4px; display:block;}
.field{margin-bottom:16px;}
h1,h2,h3{font-family:var(--font-display); margin:0; font-weight:800; letter-spacing:-0.02em;}
p{margin:0;}

.hero-title{font-size:clamp(28px, 8vw, 36px) !important;}
.hero-sub{font-size:clamp(14px, 3.6vw, 15.5px) !important;}
.brand-name{font-size:clamp(15px, 4vw, 17px) !important;}
.friend-time{font-size:clamp(17px, 5vw, 21px) !important;}
.invite-code{font-size:clamp(30px, 9vw, 40px) !important;}

.screen{padding:24px 20px 20px; position:relative;}
.screen.enter-fwd{animation:push-in .38s var(--ease-out-ios) both;}
.screen.enter-back{animation:pop-in .38s var(--ease-out-ios) both;}
@keyframes push-in{from{opacity:0; transform:translateX(18px);} to{opacity:1; transform:translateX(0);}}
@keyframes pop-in{from{opacity:0; transform:translateX(-18px);} to{opacity:1; transform:translateX(0);}}

.top-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; gap:10px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2)); display:flex;align-items:center;justify-content:center;font-size:18px; transition:background .4s ease;}
.brand-name{font-family:var(--font-display); font-weight:800; font-size:17px; letter-spacing:-0.02em;}
.icon-btn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text-lo);cursor:pointer; background:var(--glass); border:1px solid var(--glass-border); transition:transform .3s var(--ease-spring), background .18s ease, color .18s ease; flex-shrink:0;}
.icon-btn:active{transform:scale(0.86); transition:transform .1s var(--ease-out-ios);}
.icon-btn.back-btn{margin-right:2px;}
.page-title-row{display:flex; align-items:center; gap:12px; margin-bottom:6px;}
.page-title-row h2{font-size:21px;}

.hero-title{font-size:34px; line-height:1.15; margin-bottom:10px; opacity:0; animation:rise-in .55s var(--ease-out-ios) .05s forwards;}
.hero-sub{font-size:15px; color:var(--text-lo); line-height:1.6; margin-bottom:32px; opacity:0; animation:rise-in .55s var(--ease-out-ios) .12s forwards;}
.onb-card{padding:20px; margin-bottom:14px; opacity:0; animation:rise-in .5s var(--ease-out-ios) forwards;}
.stack .onb-card:nth-child(1){animation-delay:.18s;}
.stack .onb-card:nth-child(2){animation-delay:.26s;}
.stack .onb-card:nth-child(3){animation-delay:.34s;}
@keyframes rise-in{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
.onb-card-icon{width:42px;height:42px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px; transition:color .3s ease;}
.onb-card h3{font-size:15px;margin-bottom:4px;}
.onb-card p{font-size:13px;color:var(--text-lo);line-height:1.5;}
.stack{display:flex;flex-direction:column;gap:12px;}

.avatar{
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display); font-weight:700;
  background:linear-gradient(135deg,#3a4570,#2a2f52);
  color:var(--text-hi);
  flex-shrink:0;
  position:relative;
  overflow:hidden;
  background-size:cover; background-position:center;
}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.status-ring{position:absolute; inset:-3px; border-radius:50%; border:2.5px solid transparent; pointer-events:none; transition:border-color .3s ease, box-shadow .3s ease;}
.ring-free{border-color:var(--green); box-shadow:0 0 12px rgba(74,222,128,0.5); animation:ring-breathe 2.6s ease-in-out infinite;}
.ring-soon{border-color:var(--amber); box-shadow:0 0 12px rgba(251,191,36,0.4);}
.ring-dnd{border-color:var(--red); box-shadow:0 0 12px rgba(248,113,113,0.4);}
.ring-sleep{border-color:var(--grey);}
@keyframes ring-breathe{0%,100%{box-shadow:0 0 12px rgba(74,222,128,0.5);} 50%{box-shadow:0 0 18px rgba(74,222,128,0.8);}}

.layout-switch{display:flex; gap:6px; background:var(--glass); border:1px solid var(--glass-border); border-radius:14px; padding:4px; margin-bottom:20px; position:relative;}
.layout-opt{flex:1; text-align:center; padding:9px 0; border-radius:11px; font-size:12px; font-weight:600; color:var(--text-lo); cursor:pointer; transition:color .2s ease; position:relative; z-index:1; -webkit-user-select:none; user-select:none;}
.layout-opt.active{color:var(--text-hi);}
.layout-pill{position:absolute; top:4px; bottom:4px; border-radius:11px; background:var(--glass-strong); box-shadow:0 2px 8px rgba(0,0,0,0.25); transition:left .38s var(--ease-spring), width .38s var(--ease-spring); z-index:0;}

.widget-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.friend-tile{padding:16px 14px; position:relative; overflow:hidden; cursor:pointer; transition:transform .42s var(--ease-spring), box-shadow .38s var(--ease-spring); will-change:transform; opacity:0; animation:tile-in .5s var(--ease-out-ios) forwards;}
.friend-tile::after{content:'';position:absolute; inset:0; background:linear-gradient(160deg, rgba(255,255,255,0.10) 0%, transparent 35%); pointer-events:none;}
.friend-tile:active{transform:scale(0.955); transition:transform .1s var(--ease-out-ios);}
@keyframes tile-in{from{opacity:0; transform:translateY(10px) scale(0.96);} to{opacity:1; transform:translateY(0) scale(1);}}
.friend-tile .avatar{width:46px;height:46px;font-size:16px; margin-bottom:10px;}
.friend-name{font-size:14px;font-weight:700;margin-bottom:2px; overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.friend-time{font-size:20px;font-weight:800;font-family:var(--font-display); margin-bottom:6px;}
.friend-status{font-size:12px;color:var(--text-lo); display:flex; align-items:center; gap:5px; margin-bottom:4px; line-height:1.4;}
.friend-countdown{font-size:11px; color:var(--text-faint); font-weight:600;}
.tile-content{position:relative; z-index:1;}
.widget-grid .friend-tile:nth-child(1){animation-delay:0ms;}
.widget-grid .friend-tile:nth-child(2){animation-delay:40ms;}
.widget-grid .friend-tile:nth-child(3){animation-delay:80ms;}
.widget-grid .friend-tile:nth-child(4){animation-delay:120ms;}
.widget-grid .friend-tile:nth-child(5){animation-delay:160ms;}
.widget-grid .friend-tile:nth-child(6){animation-delay:200ms;}

.list-item{padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; transition:transform .38s var(--ease-spring); opacity:0; animation:row-in .42s var(--ease-out-ios) forwards;}
@keyframes row-in{from{opacity:0; transform:translateX(-8px);} to{opacity:1; transform:translateX(0);}}
.list-item:nth-child(1){animation-delay:0ms;} .list-item:nth-child(2){animation-delay:35ms;}
.list-item:nth-child(3){animation-delay:70ms;} .list-item:nth-child(4){animation-delay:105ms;}
.list-item:nth-child(5){animation-delay:140ms;} .list-item:nth-child(6){animation-delay:175ms;}
.list-item:active{transform:scale(0.97);}
.list-left{display:flex; align-items:center; gap:12px; min-width:0;}
.list-item .avatar{width:44px;height:44px;font-size:15px;}

.wheel-wrap{position:relative; width:100%; aspect-ratio:1/1; max-width:340px; margin:20px auto 0; display:flex; align-items:center; justify-content:center;}
.wheel-center{width:96px;height:96px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2; padding:8px;}
.wheel-center-time{font-family:var(--font-display); font-weight:800; font-size:22px; line-height:1;}
.wheel-center-sub{font-size:10px; color:var(--text-lo); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px;}
.wheel-node{position:absolute; width:72px; display:flex; flex-direction:column; align-items:center; gap:4px; transform:translate(-50%,-50%); cursor:pointer; opacity:0; animation:node-pop .48s var(--ease-spring) forwards; transition:transform .3s var(--ease-spring);}
.wheel-node:active{transform:translate(-50%,-50%) scale(0.92) !important;}
@keyframes node-pop{from{opacity:0; transform:translate(-50%,-50%) scale(0.6);} to{opacity:1; transform:translate(-50%,-50%) scale(1);}}
.wheel-node .avatar{width:52px;height:52px;font-size:18px;}
.wheel-node-name{font-size:11px; font-weight:700; text-align:center; max-width:70px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

.bottom-nav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; padding:12px 20px calc(14px + env(safe-area-inset-bottom)); background:rgba(11,14,26,0.72); backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px); border-top:1px solid var(--glass-border); display:flex; justify-content:space-around; align-items:center; z-index:90; animation:nav-in .5s var(--ease-out-ios) .05s backwards;}
@keyframes nav-in{from{opacity:0; transform:translate(-50%, 16px);} to{opacity:1; transform:translate(-50%, 0);}}
.nav-item{display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text-faint); font-size:10px; font-weight:600; cursor:pointer; transition:color .2s ease, transform .3s var(--ease-spring); -webkit-user-select:none; user-select:none;}
.nav-item i{font-size:22px; transition:transform .3s var(--ease-spring);}
.nav-item.active{color:var(--accent);}
.nav-item.active i{transform:translateY(-1px) scale(1.08);}
.nav-item:active{transform:scale(0.88); transition:transform .1s var(--ease-out-ios);}

.sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0); backdrop-filter:blur(0px); -webkit-backdrop-filter:blur(0px); z-index:100; display:flex; align-items:flex-end; transition:background .3s var(--ease-out-ios), backdrop-filter .3s var(--ease-out-ios);}
.sheet-backdrop.open{background:rgba(0,0,0,0.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);}
.sheet-backdrop.closing{background:rgba(0,0,0,0); backdrop-filter:blur(0px);}
.sheet{width:100%; max-width:480px; margin:0 auto; border:1px solid var(--glass-border); border-bottom:none; border-radius:28px 28px 0 0; padding:20px 22px calc(28px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; transform:translateY(100%); transition:transform .46s var(--ease-sheet); box-shadow:0 -10px 40px rgba(0,0,0,0.6); will-change:transform;}
.sheet-backdrop.open .sheet{transform:translateY(0);}
.sheet-backdrop.closing .sheet{transform:translateY(100%); transition:transform .26s var(--ease-out-ios);}
.sheet-backdrop.dragging .sheet{transition:none;}
.sheet-handle{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,0.2);margin:0 auto 16px; cursor:grab;}
.sheet-backdrop::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 22% 12%,rgba(var(--accent-rgb),.18),transparent 28%),radial-gradient(circle at 78% 70%,rgba(255,255,255,.05),transparent 30%);}
.sheet{position:relative;background:linear-gradient(145deg,rgba(31,37,64,.72),rgba(12,16,31,.72));backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid rgba(255,255,255,.14);box-shadow:0 -18px 60px -24px rgba(0,0,0,.82),inset 0 1px 0 rgba(255,255,255,.11);}
.sheet::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.11),transparent 24%,transparent 70%,rgba(255,255,255,.035));}
.sheet > *{position:relative;z-index:1;}
.liquid-popup{overflow:hidden;}
.dialog,.motion-dialog,.motion-popover{background:linear-gradient(145deg,rgba(31,37,64,.74),rgba(12,16,31,.74))!important;backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border-color:rgba(255,255,255,.14)!important;box-shadow:0 30px 80px -30px rgba(0,0,0,.82),inset 0 1px 0 rgba(255,255,255,.11)!important;}
.dialog::before,.motion-dialog::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.10),transparent 24%,transparent 72%,rgba(255,255,255,.035));}
.motion-dialog > *,.dialog > *{position:relative;z-index:1;}
.motion-popover::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.10),transparent 28%,transparent 74%,rgba(255,255,255,.03));}
.motion-popover > *{position:relative;z-index:1;}
#watch-autoplay-hint.show{display:flex!important;}

.sheet-title{font-size:19px; font-weight:800; margin-bottom:4px;}
.sheet-sub{font-size:13px; color:var(--text-lo); margin-bottom:20px;}

.presets{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
.preset-pill{display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:12px; background:rgba(255,255,255,0.06); border:1px solid var(--glass-border); font-size:12px; font-weight:600; cursor:pointer; transition:transform .25s var(--ease-spring), background .2s ease, border-color .2s ease;}
.preset-pill.active{background:var(--accent-soft); border-color:var(--accent);}
.preset-pill:active{transform:scale(0.93); background:rgba(255,255,255,0.15);}
.preset-pill i{font-size:14px; color:var(--accent);}

.avail-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:18px;}
.avail-chip{display:flex; align-items:center; justify-content:center; gap:6px; padding:11px 6px; font-size:12.5px; font-weight:700; text-align:center; border-radius:13px; cursor:pointer; border:1.5px solid var(--glass-border); background:var(--glass); color:var(--text-lo); transition:transform .28s var(--ease-spring), background .18s ease, border-color .18s ease, color .18s ease;}
.avail-chip i{font-size:14px;}
.avail-chip:active{transform:scale(0.94); transition:transform .1s var(--ease-out-ios);}

.toast{position:fixed; top:calc(20px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%) translateY(-30px) scale(0.92); background:rgba(28,32,56,0.8); backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%); border:1px solid var(--glass-border); color:var(--text-hi); padding:11px 18px; border-radius:20px; font-size:13px; font-weight:600; box-shadow:0 14px 34px -8px rgba(0,0,0,0.5); opacity:0; pointer-events:none; transition:transform .46s var(--ease-spring), opacity .25s ease; z-index:200; display:flex; align-items:center; gap:8px; max-width:88%;}
.toast.show{transform:translateX(-50%) translateY(0) scale(1); opacity:1;}

.sync-badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--green); font-weight:600;}
.sync-badge.offline{color:var(--red);}
.sync-badge i{font-size:12px; animation:spin 3s linear infinite;}
.sync-badge.offline i{animation:none;}
@keyframes spin{to{transform:rotate(360deg);}}

.login-wrap{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; text-align:center; position:relative; z-index:1;}
.login-logo{width:76px;height:76px;border-radius:24px;background:linear-gradient(135deg,var(--accent),var(--accent-2)); display:flex;align-items:center;justify-content:center; margin-bottom:24px; box-shadow:0 20px 50px -18px var(--accent-glow); animation:rise-in .6s var(--ease-out-ios) both;}
.login-logo i{font-size:34px; color:#0B0E1A;}
.login-methods{width:min(360px,100%);display:grid;gap:10px;}
.login-divider{display:flex;align-items:center;gap:10px;color:var(--text-faint);font-size:11px;text-transform:uppercase;letter-spacing:.08em;width:min(360px,100%);margin:4px 0;}
.login-divider::before,.login-divider::after{content:'';height:1px;background:var(--glass-border);flex:1;}
.login-email-card{width:min(360px,100%);padding:14px;margin-top:2px;}
.viewer-badge{position:fixed;top:14px;right:14px;z-index:160;padding:8px 11px;border-radius:999px;background:rgba(var(--accent-rgb),.14);border:1px solid rgba(var(--accent-rgb),.3);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);font-size:11px;font-weight:800;color:var(--accent);box-shadow:0 10px 30px -18px rgba(0,0,0,.7);}
.viewer-banner{position:sticky;top:10px;z-index:75;margin:0 0 14px;padding:10px 12px;border-radius:14px;background:linear-gradient(135deg,rgba(var(--accent-rgb),.16),rgba(255,255,255,.04));border:1px solid rgba(var(--accent-rgb),.26);display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--text-lo);}
.viewer-banner strong{color:var(--text-hi);}
.viewer-exit{margin-left:auto;white-space:nowrap;padding:7px 10px;border-radius:10px;border:1px solid var(--glass-border);background:rgba(255,255,255,.055);color:var(--text-hi);font-weight:700;cursor:pointer;}


.board-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.board-note{padding:14px; position:relative; opacity:0; animation:tile-in .45s var(--ease-out-ios) forwards; min-height:100px; display:flex; flex-direction:column;}
.board-note-text{font-size:13px; line-height:1.5; flex:1; overflow-wrap:break-word;}
.board-note-meta{display:flex; align-items:center; gap:6px; margin-top:10px; font-size:10.5px; color:var(--text-faint);}
.board-note-meta .avatar{width:18px;height:18px;font-size:8px;}
.fab{position:fixed; bottom:calc(96px + env(safe-area-inset-bottom)); right:calc(50% - 240px + 20px); width:54px;height:54px;border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent-2)); display:flex;align-items:center;justify-content:center; box-shadow:0 14px 30px -10px var(--accent-glow); cursor:pointer; z-index:80; transition:transform .35s var(--ease-spring);}
.fab:active{transform:scale(0.9);}
.fab i{font-size:24px; color:#0B0E1A;}
@media (max-width:520px){ .fab{right:20px;} }

.theme-swatch-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
.theme-swatch{width:40px;height:40px;border-radius:50%; cursor:pointer; border:2.5px solid transparent; transition:transform .28s var(--ease-spring), border-color .2s ease; position:relative;}
.theme-swatch.active{border-color:#fff;}
.theme-swatch:active{transform:scale(0.88);}
.theme-swatch.active::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 2px var(--bg-0), 0 0 0 4px rgba(255,255,255,0.4);}

.section-label{font-size:12px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.07em; margin:24px 0 12px 4px;}
.section-label:first-child{margin-top:0;}
.small-note{font-size:11.5px; color:var(--text-faint); line-height:1.5; margin-top:6px;}
.empty-hint{text-align:center; padding:40px 20px; color:var(--text-lo); font-size:13.5px; line-height:1.6;}
.divider{height:1px; background:var(--glass-border); margin:16px 0;}
.loading-wrap{min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;}
.spinner{width:32px;height:32px;border-radius:50%; border:3px solid var(--glass-border); border-top-color:var(--accent); animation:spin 0.8s linear infinite;}
::-webkit-scrollbar{display:none;}

/* Compact density — tightens paddings/sizes across tiles and list rows */
body.density-compact .friend-tile{padding:12px 10px !important;}
body.density-compact .list-item{padding:10px 12px !important; margin-bottom:7px !important;}
body.density-compact .avatar{width:34px !important;height:34px !important;font-size:12px !important;}
body.density-compact .list-item .avatar{width:36px !important;height:36px !important;}
body.density-compact .friend-time{font-size:15px !important;}
body.density-compact .glass, body.density-compact .glass-strong{border-radius:14px;}
body.density-compact .board-note{min-height:78px !important; padding:10px !important;}
body.density-compact .screen{padding:18px 16px 16px;}

body.reduce-motion-pref *, body.reduce-motion-pref *::before, body.reduce-motion-pref *::after{
  animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;
}

.color-swatch-custom{width:40px;height:40px;border-radius:50%;cursor:pointer;border:2.5px solid var(--glass-border);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.05);color:var(--text-lo);font-size:16px;transition:transform .28s var(--ease-spring), border-color .2s ease;}
.color-swatch-custom:active{transform:scale(0.88);}
.color-swatch-custom.active{border-color:#fff;}
#custom-accent-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}

.nudge-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid var(--glass-border);font-size:12px;font-weight:700;cursor:pointer;color:var(--accent);transition:transform .25s var(--ease-spring), background .2s ease, opacity .2s ease;}
.nudge-btn:active{transform:scale(0.92);}
.nudge-btn[disabled]{opacity:.45;pointer-events:none;}
.nudge-btn i{font-size:14px;}

.reaction-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.reaction-chip{display:flex;align-items:center;gap:3px;font-size:11.5px;padding:3px 8px;border-radius:10px;background:rgba(255,255,255,0.07);border:1px solid var(--glass-border);cursor:pointer;transition:transform .25s var(--ease-spring), background .2s ease, border-color .2s ease;}
.reaction-chip:active{transform:scale(0.9);}
.reaction-chip.mine{background:var(--accent-soft);border-color:var(--accent);}
.reaction-add{font-size:11.5px;padding:3px 7px;border-radius:10px;background:transparent;border:1px dashed var(--glass-border);color:var(--text-faint);cursor:pointer;}
.reaction-picker{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--glass-border);}
.reaction-pick-opt{font-size:19px;cursor:pointer;padding:4px 7px;border-radius:10px;transition:transform .25s var(--ease-spring), background .2s ease;}
.reaction-pick-opt:active{transform:scale(0.85); background:rgba(255,255,255,0.1);}

/* ── XP / group identity layer ───────────────────────────────────────── */
.xp-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:var(--accent-soft);border:1px solid rgba(var(--accent-rgb),.28);color:var(--accent);font-size:11px;font-weight:800;}
.xp-hero{padding:18px;overflow:hidden;background:linear-gradient(135deg,rgba(var(--accent-rgb),.24),rgba(var(--accent-rgb),.06) 48%,rgba(255,255,255,.035));border-color:rgba(var(--accent-rgb),.28);}
.xp-number{font-family:var(--font-display);font-size:42px;line-height:1;font-weight:800;letter-spacing:-.04em;}
.xp-rule{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;}
.xp-reward{font-weight:800;color:var(--accent);}
.xp-negative{color:#FF8A9E;}
.xp-group-row{display:flex;align-items:center;gap:10px;padding:10px 12px;}
.group-mark{display:flex;align-items:center;justify-content:center;flex:0 0 auto;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,var(--group-accent),var(--group-accent-2));color:#0B0E1A;box-shadow:0 10px 24px -12px rgba(var(--group-accent-rgb),.65);}
.group-mark img{width:100%;height:100%;object-fit:cover;}
.group-theme-card{--accent:var(--group-accent);--accent-2:var(--group-accent-2);--accent-rgb:var(--group-accent-rgb);}
.group-identity{border-color:rgba(var(--group-accent-rgb),.28) !important;background:linear-gradient(135deg,rgba(var(--group-accent-rgb),.18),rgba(255,255,255,.035));}
.wheel-center .group-mark{box-shadow:0 0 0 5px rgba(var(--group-accent-rgb),.12),0 14px 28px -14px rgba(var(--group-accent-rgb),.7);}
.wheel-center-time{font-size:12px!important;margin-top:7px;}
.spin-wheel{display:flex;align-items:center;justify-content:center;width:132px;height:132px;border-radius:50%;margin:6px auto 16px;border:1px solid rgba(var(--accent-rgb),.28);background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.10),rgba(var(--accent-rgb),.07) 45%,rgba(0,0,0,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 20px 50px -24px var(--accent-glow);}
.spin-wheel.spinning{animation:spin-pop .8s var(--ease-spring);}
@keyframes spin-pop{0%{transform:rotate(0) scale(1)}45%{transform:rotate(190deg) scale(1.08)}100%{transform:rotate(360deg) scale(1)}}
.shop-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;}
.shop-price{font-size:12px;font-weight:800;color:var(--accent);}



/* ── Liquid interaction layer ────────────────────────────────────────────
   Directional deformation driven by Pointer Events + a small spring solver.
   It intentionally does not move cards out of their layout; the gesture is
   viscous/stretchy and settles back to rest after release. */
.liquid-interactive{
  --liq-x:0px;
  --liq-y:0px;
  --liq-rot:0deg;
  --liq-skew-x:0deg;
  --liq-skew-y:0deg;
  --liq-scale-x:1;
  --liq-scale-y:1;
  --liq-press:1;
  --liq-light-x:50%;
  --liq-light-y:50%;
  transform:translate3d(calc(var(--liq-x) + var(--px,0px)),calc(var(--liq-y) + var(--py,0px)),0)
    perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) rotate(var(--liq-rot))
    skew(var(--liq-skew-x),var(--liq-skew-y))
    scale3d(calc(var(--liq-scale-x) * var(--liq-press)),calc(var(--liq-scale-y) * var(--liq-press)),1);
  transform-origin:center center;
  will-change:transform;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  touch-action:manipulation;
  transition:box-shadow .24s ease, filter .24s ease, background .24s ease;
}
.liquid-interactive::after{
  background:
    radial-gradient(circle at var(--liq-light-x) var(--liq-light-y),
      rgba(255,255,255,.24) 0%, rgba(255,255,255,.10) 13%, transparent 34%);
  opacity:.58;
  transition:opacity .22s ease;
}
.liquid-interactive::before{
  background:
    linear-gradient(135deg,rgba(255,255,255,.24),transparent 24%,transparent 62%,rgba(255,255,255,.06));
}
.liquid-interactive.liquid-active{
  box-shadow:
    0 1px 0 rgba(255,255,255,.10) inset,
    0 16px 38px -18px rgba(0,0,0,.66),
    0 0 34px -22px rgba(var(--accent-rgb),.72);

// Renders "ti ti-<name>" (and legacy "ti-<name>") strings into inline SVG.
// Kept name-compatible with the old font classes so no other code needs
// to change — just call icon('hand-wave') or icon('ti-hand-wave').
function icon(name, cls){
  const key = String(name||'').replace(/^ti[\s-]?/,'').replace(/^ti-/,'').trim();
  const body = ICONS[key] || ICONS['circle-dot'];
  return `<svg class="icon ${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><g>${body}</g></svg>`;
}

function normalizeSquadData(sq){
  if(!sq) return sq;
  // Heal duplicated membership records from older join/approval flows.

async function reconcileUserXpBalance(){
  if(!ME || isViewerMode() || typeof window.fbGet !== 'function') return false;
  const localXp=Math.max(0,Math.floor(Number(ME.xp)||0));
  try{
    // IMPORTANT: the canonical XP value is the xp field on the Firebase user
    // record. Older builds also used users/<uid>/xp, which could drift from
    // the profile object and make spending appear to have 0 XP. We deliberately
    // ignore that legacy mirror here.
    const remote=await window.fbGet('users/'+ME.id);
    const remoteXp=remote==null ? null : Math.max(0,Math.floor(Number(remote.xp)||0));
    if(remoteXp===null){
      // No remote profile yet: preserve the local balance and create the field.
      if(localXp>0){
        const r=await window.fbTxn('users/'+ME.id,current=>{
          const obj=(current && typeof current==='object')?{...current}:{};
          const cur=Math.max(0,Math.floor(Number(obj.xp)||0));
          obj.xp=Math.max(cur,localXp);
          return obj;
        });
        const data=r.snapshot?.val?.();
        ME.xp=Math.max(localXp,Math.floor(Number(data?.xp)||0));
      }
    }else if(localXp>remoteXp){
      // Promote a locally-held newer balance without ever decreasing Firebase.
      const r=await window.fbTxn('users/'+ME.id,current=>{
        const obj=(current && typeof current==='object')?{...current}:{};
        const cur=Math.max(0,Math.floor(Number(obj.xp)||0));
        obj.xp=Math.max(cur,localXp);
        return obj;
      });
      const data=r.snapshot?.val?.();
      ME.xp=Math.max(localXp,Math.floor(Number(data?.xp)||0));
    }else{
      // Firebase is authoritative when it is newer/equal.
      ME.xp=remoteXp;
    }
    localStorage.setItem(lsKey('me'),JSON.stringify(ME));
    return true;
  }catch(e){
    console.warn('XP balance reconciliation skipped',e);
    return false;
  }
}

async function saveMe(){
  if (!ME) return false;
  if (isViewerMode()) { showToast('Viewer Mode is read-only — sign in to save changes','ti-lock'); return false; }

    localStorage.setItem(lsKey('me'), JSON.stringify(ME));
    console.warn('profile sync skipped — Firebase bridge not ready');
    return false;
  }
  // Reconcile XP before saving the profile so an older/stale client cannot
  // overwrite the live balance with 0 (or another stale value).
  await reconcileUserXpBalance();
  localStorage.setItem(lsKey('me'), JSON.stringify(ME));
  try { await window.fbUpdate('users/' + ME.id, ME); return true; } catch(e){ console.warn('profile sync failed', e); return false; }
}

let SQUAD_SYNC_BASE=null;
function deepCloneSafe(v){try{return JSON.parse(JSON.stringify(v))}catch(e){return v}}

async function saveSquad(){

  // base recorded for it yet), diffing against it compares apples to oranges: fields that
  // happen to match between two unrelated squads get silently dropped from the write, so
  // other clients can read back an incomplete record (missing groupStyle fields, stale
  // settings, etc). In that case write the full object instead of a patch.
  const baseMatchesCurrent = SQUAD_SYNC_BASE && SQUAD_SYNC_BASE.id === SQUAD.id;

// Approves or denies a pending join request. Only callable by someone with
// the manageMembers permission (buttons are hidden otherwise, but we also
// re-check here since Firebase writes aren't otherwise access-controlled
// client-side). Approving moves the requester into members/status/roles;
// denying just drops their request entry.
async function resolveJoinRequest(uid, approve){
  if(!SQUAD || !can(ME.id, 'manageMembers')){ showToast('You cannot manage members', 'ti-ban'); return; }
  const req = (SQUAD.joinRequests || []).find(r => r.id === uid);
  if(!req) return;

  if(!approve){
    SQUAD.joinRequests = (SQUAD.joinRequests || []).filter(r => r.id !== uid);
    SQUAD.updatedAt = Date.now();
    await saveSquad();
    try{await window.fbUpdate('users/'+uid+'/notifications/'+`group_denied_${SQUAD.id}`,{id:`group_denied_${SQUAD.id}`,type:'group_denied',title:'Group request denied',body:`Your request to join ${SQUAD.name} was denied.`,ts:Date.now(),read:false});await window.fbUpdate('users/'+uid+'/notifications/'+`group_request_${SQUAD.id}`,{read:true});}catch(e){}
    softUpdate();
    showToast(`Denied ${req.name.split(' ')[0]}'s request`, 'ti-x');
    return;
  }

  const cap = SQUAD.maxMembers || 6;
  if(SQUAD.members.length >= cap){
    showToast('Squad is full — cannot approve', 'ti-alert-triangle');
    return;
  }
  if(SQUAD.members.some(m => m.id === uid)){
    SQUAD.joinRequests = (SQUAD.joinRequests || []).filter(r => r.id !== uid);
    SQUAD.updatedAt = Date.now();
    await saveSquad();
    softUpdate();
    return;
  }

  let requester = null;
  try{ requester = await window.fbGet('users/' + uid); }catch(e){}
  const requesterGroups = Array.isArray(requester?.groupIds) ? requester.groupIds : (requester?.squadId?[requester.squadId]:[]);
  const requesterCreated = Number(requester?.createdGroupCount||0);
  const requesterJoined = Math.max(0, requesterGroups.length - requesterCreated);
  if(requesterJoined >= XP_CONFIG.maxJoinedGroups){
    showToast(`${req.name.split(' ')[0]} already belongs to 3 joined groups`,'ti-alert-triangle');
    return;
  }
  if(requester && requesterCreated >= XP_CONFIG.maxCreatedGroups){
    // This approval is a join, so a user can still join if they have room in their joined-group allowance.
  }
  const joinCost = 0;

  if(requester){
    try{
      if(joinCost>0){const charged=await atomicUserXpDelta(uid,-joinCost);if(!charged.ok){showToast(`${req.name.split(' ')[0]} could not complete the join`,'ti-alert-triangle');return}requester.xp=charged.xp}
      requester.groupIds=[...new Set([...(requester.groupIds||[]),...(requester.squadId?[requester.squadId]:[]),SQUAD.id])];
      requester.xpState=requester.xpState||{};requester.xpState.groupBonuses=requester.xpState.groupBonuses||{};const bonusKey=`${SQUAD.id}:member`;if(!requester.xpState.groupBonuses[bonusKey])requester.xpState.groupBonuses[bonusKey]=Date.now();
      await window.fbUpdate('users/'+uid,{groupIds:[...new Set(requester.groupIds)],squadId:requester.squadId||null,xp:requester.xp,xpState:requester.xpState});
      await window.fbUpdate('users/'+uid+'/notifications/'+`group_accepted_${SQUAD.id}`,{id:`group_accepted_${SQUAD.id}`,type:'group_accepted',title:'You were accepted',body:`You joined ${SQUAD.name}. Open the group — no code needed.`,groupId:SQUAD.id,screen:'home',ts:Date.now(),read:false});
      await window.fbUpdate('users/'+uid+'/notifications/'+`group_request_${SQUAD.id}` ,{read:true});
    }catch(e){showToast('Could not finalize the join — membership was not committed','ti-alert-triangle');return}
  }

  SQUAD.joinRequests = (SQUAD.joinRequests || []).filter(r => r.id !== uid);
  // Guard against double-adding: if this uid is somehow already present
  // (e.g. two approve taps landing before the UI could disable the button),
  // don't push a second copy.
  if(!SQUAD.members.some(m => m.id === req.id)){
    SQUAD.members.push({ id: req.id, name: req.name, tz: req.tz, photo: req.photo || '', emoji: '' });
  }
  SQUAD.groupXp=Number(SQUAD.groupXp||0)+25;
  if(!SQUAD.status) SQUAD.status = {};
  SQUAD.status[uid] = { avail:'free', icon:'ti-hand-wave', text:'Just joined' };
  if(!SQUAD.roles) SQUAD.roles = {};
  SQUAD.roles[uid] = 'member';
  if(!SQUAD.permissions) SQUAD.permissions = {};
  SQUAD.permissions[uid] = { ...DEFAULT_PERMISSIONS.member };
  SQUAD.updatedAt = Date.now();
  await saveSquad();
  softUpdate();
  showToast(`${req.name.split(' ')[0]} added to squad`, 'ti-check');
}

// Reads the current device's battery via the (Chromium-only) Battery

// don't support the API (Safari, Firefox) simply never publish a value,

let batteryObj = null;

  if(!batteryObj || !SQUAD || !ME) return;
  if(!SQUAD.battery) SQUAD.battery = {};
  SQUAD.battery[ME.id] = { level: Math.round(batteryObj.level * 100), charging: !!batteryObj.charging, ts: Date.now() };
  SQUAD.updatedAt = Date.now();
  await saveSquad();

  return (SQUAD && SQUAD.battery && SQUAD.battery[uid]) || null;

function batteryIconFor(level, charging){

  if(level <= 25) return 'battery-2';

}

function timeUntil(ts){
  if(!ts) return null;
  const diff = ts - Date.now();
  if(diff <= 0) return null;
  const mins = Math.ceil(diff / 60000);

      const now=performance.now(), dt=Math.max(8,now-state.lastT);
      const rawX=e.clientX-state.startX, rawY=e.clientY-state.startY;
      if(Math.hypot(rawX,rawY)>5){
        state.clickMoved = true;
        if(!state.captured){
          state.captured=true;
          try{el.setPointerCapture(e.pointerId);}catch(_){ }
        }
      }
      // Rubber-band the further part of the gesture instead of allowing the
      // card to feel detached from its original position.
      const damp=v=>Math.sign(v)*Math.pow(Math.min(Math.abs(v),120),.82)*.92;
      state.x=clamp(damp(rawX),-68,68);
      state.y=clamp(damp(rawY),-68,68);
      state.vx=(e.clientX-state.lastX)/(dt/1000);
      state.vy=(e.clientY-state.lastY)/(dt/1000);
      state.vx=clamp(state.vx,-1200,1200); state.vy=clamp(state.vy,-1200,1200);
      state.lastX=e.clientX; state.lastY=e.clientY; state.lastT=now;
      render(state.x,state.y,true);
    }

    function onUp(e){
      if(!state.active || (e.pointerId!==undefined && e.pointerId!==state.pointerId)) return;
      try{if(state.captured) el.releasePointerCapture(e.pointerId);}catch(_){ }
      // Preserve a fraction of release velocity so the snap-back has a little
      // personality rather than merely easing from a static offset.
      state.vx=clamp(state.vx*.12,-155,155);
      state.vy=clamp(state.vy*.12,-155,155);
      springBack();
      // Desktop-safe click recovery: if a small interactive control moved under
      // the pointer during the liquid gesture, Chromium may suppress its native
      // click. Re-issue a click only when the gesture remained click-sized.
      if(state.clickEligible && !state.clickMoved && !el.disabled && (state.pointerType==='mouse' || state.pointerType==='pen')){
        setTimeout(()=>{
          if(document.body.contains(el) && !el.matches(':disabled')){
            el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:window}));
          }
        },0);
      }
    }

    function onCancel(){
      if(state.active) springBack();
    }

    function onEnter(e){
      if(document.body.classList.contains('reduce-motion-pref')) return;
      const r=el.getBoundingClientRect();
      el.style.setProperty('--liq-light-x',clamp(((e.clientX-r.left)/r.width)*100,5,95).toFixed(1)+'%');
      el.style.setProperty('--liq-light-y',clamp(((e.clientY-r.top)/r.height)*100,5,95).toFixed(1)+'%');
    }

    el.addEventListener('pointerdown',onDown,{passive:false});
    el.addEventListener('pointermove',onMove,{passive:true});
    el.addEventListener('pointerup',onUp,{passive:true});
    el.addEventListener('pointercancel',onCancel,{passive:true});
    el.addEventListener('pointerenter',onEnter,{passive:true});

    window.__liquidInteractionCleanup.set(el,()=>{
      stopSpring();
      el.removeEventListener('pointerdown',onDown);
      el.removeEventListener('pointermove',onMove);
      el.removeEventListener('pointerup',onUp);
      el.removeEventListener('pointercancel',onCancel);
      el.removeEventListener('pointerenter',onEnter);
    });
  });
}


function playPageWipe(cb){ if(LOCAL.reduceMotion||LOCAL.pageTransitions===false){cb();return;} const w=document.getElementById('page-wipe'); if(!w){cb();return;} w.className='page-wipe'; requestAnimationFrame(()=>{w.classList.add('in'); setTimeout(()=>{cb();requestAnimationFrame(()=>{w.classList.remove('in');w.classList.add('out');setTimeout(()=>w.className='page-wipe',380);});},190);}); }
function initMotionCards(){ document.querySelectorAll('.motion-card').forEach(el=>{ if(el.dataset.motionBound==='1')return;el.dataset.motionBound='1';let active=false;const reset=()=>{el.style.setProperty('--tilt-x','0deg');el.style.setProperty('--tilt-y','0deg');el.classList.remove('motion-pressed');};el.addEventListener('pointerenter',()=>{active=true},{passive:true});el.addEventListener('pointermove',e=>{if(!active||!LOCAL.tilt||LOCAL.reduceMotion)return;const r=el.getBoundingClientRect(),nx=(e.clientX-r.left)/r.width-.5,ny=(e.clientY-r.top)/r.height-.5;el.style.setProperty('--tilt-x',(-ny*5.2).toFixed(2)+'deg');el.style.setProperty('--tilt-y',(nx*6.5).toFixed(2)+'deg');},{passive:true});el.addEventListener('pointerdown',()=>el.classList.add('motion-pressed'),{passive:true});el.addEventListener('pointerup',()=>el.classList.remove('motion-pressed'),{passive:true});el.addEventListener('pointerleave',()=>{active=false;reset();},{passive:true});el.addEventListener('pointercancel',reset,{passive:true});}); }
function initHoldToConfirm(){ document.querySelectorAll('[data-hold-confirm]').forEach(btn=>{if(btn.dataset.holdBound==='1')return;btn.dataset.holdBound='1';const dur=900;let start=0,timer=0,raf=0,ok=false;const bar=document.createElement('span');bar.className='hold-progress';btn.appendChild(bar);const reset=()=>{clearTimeout(timer);cancelAnimationFrame(raf);start=0;bar.style.width='0%';btn.classList.remove('motion-holding');};const loop=()=>{if(!start)return;const p=Math.min(1,(performance.now()-start)/dur);bar.style.width=(p*100)+'%';if(p<1)raf=requestAnimationFrame(loop);};btn.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;ok=false;start=performance.now();btn.classList.add('motion-holding');raf=requestAnimationFrame(loop);timer=setTimeout(()=>{ok=true;btn.dataset.holdConfirmed='1';bar.style.width='100%';btn.click();setTimeout(reset,80);},dur);},{passive:true});btn.addEventListener('pointerup',()=>{if(!ok)reset();},{passive:true});btn.addEventListener('pointercancel',reset,{passive:true});btn.addEventListener('click',e=>{if(btn.dataset.holdConfirmed==='1'){delete btn.dataset.holdConfirmed;return;}e.preventDefault();e.stopImmediatePropagation();showToast('Hold to confirm','ti-hand-stop');},{capture:true});}); }

function renderGrid(members){
  const tiles = members.map(f => {
    const st = friendState(f);
    const isMe = f.id === ME.id;
    const cd = timeUntil(st.freeAt);
    const a = AVAIL_STATES.find(a=>a.id===st.avail) || AVAIL_STATES[0];
    return `
      <div class="friend-tile glass" data-id="${f.id}">
        <div class="tile-content">
          ${renderAvatarMarkup(f,38,`<div class="status-ring ${a.ring}"></div>`)}

function renderWheel(members){
  const count = members.length;
  const radius = 112;
  const nodes = members.map((f, i) => {
    const angle = (i / Math.max(1,count)) * (2 * Math.PI) - (Math.PI / 2);
    const x = Math.round(radius * Math.cos(angle));
    const y = Math.round(radius * Math.sin(angle));
    const st = friendState(f);
    const a = AVAIL_STATES.find(a=>a.id===st.avail) || AVAIL_STATES[0];
    return `
      <div class="radial-node" style="--orbit-x:${x}px;--orbit-y:${y}px;--delay:${Math.min(i*70,560)}ms" data-id="${escapeHtml(f.id)}">
        ${renderAvatarMarkup(f,52,`<div class="status-ring ${a.ring}"></div>`)}
        <div class="radial-node-name">${escapeHtml(f.name)}</div>
        <div style="font-size:10px;color:var(--text-lo);text-align:center;">${escapeHtml(getTimeInTz(f.tz))}</div>

function ensureAvatarShopState(){
  ensureAccountState();
  if(!ME.xpState.avatarShop) ME.xpState.avatarShop={owned:{},weekly:{},monthly:{}};
  if(!ME.xpState.avatarShop.owned) ME.xpState.avatarShop.owned={};
  if(!ME.xpState.avatarShop.weekly) ME.xpState.avatarShop.weekly={};
  if(!ME.xpState.avatarShop.monthly) ME.xpState.avatarShop.monthly={};
}
function avatarShopPeriod(item){
  const d=new Date();
  if(item.frequency==='weekly'){
    const first=new Date(d.getFullYear(),0,1); const week=Math.floor(((d-first)/86400000+first.getDay())/7)+1;
    return `${d.getFullYear()}-W${String(week).padStart(2,'0')}`;
  }
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function avatarShopClaimed(item){
  ensureAvatarShopState();
  if(item.frequency==='one-time') return !!ME.xpState.avatarShop.owned[item.id];
  const bucket=item.frequency==='weekly'?ME.xpState.avatarShop.weekly:ME.xpState.avatarShop.monthly;
  return bucket[item.id]===avatarShopPeriod(item);
}

// Nudges are rate-limited per-friend to avoid spamming — 15 minute cooldown.
const NUDGE_COOLDOWN_MS = 15 * 60000;
function nudgeCooldownRemaining(friendId){
  const last = (LOCAL.lastNudge || {})[friendId];
  if(!last) return 0;
  const left = NUDGE_COOLDOWN_MS - (Date.now() - last);
  return left > 0 ? Math.ceil(left / 60000) : 0;
}
async function sendNudge(friendId, friendName){
  if(nudgeCooldownRemaining(friendId) > 0){
    showToast('Already nudged recently', 'ti-clock');
    return;
  }
  if(!(await spendXp(XP_CONFIG.nudge,'Nudge'))) return;
  if(!LOCAL.lastNudge) LOCAL.lastNudge = {};
  LOCAL.lastNudge[friendId] = Date.now();
  await saveLocal();
  if(typeof window.fbSet === 'function' && SQUAD){
    try{
      await window.fbSet('nudges/' + SQUAD.id + '/' + friendId, { from: ME.id, fromName: ME.name, ts: Date.now() });
    }catch(e){
      await grantXp(1,'Nudge refund');
      showToast('Could not send nudge — 1 XP refunded','ti-alert-triangle');
      return;
    }
  }
  showToast(`Nudged ${friendName.split(' ')[0]} · −1 XP`, 'ti-hand-click');
}

// Shared by both "Remove" (can rejoin later) and "Remove & Ban" (blocked from
// rejoining or re-requesting this squad until an owner/admin unbans them).
async function removeSquadMember(uid, opts={}){
  const ban = !!opts.ban;
  if(!can(ME.id,'manageMembers')) return showToast('You cannot remove members','ti-ban');
  if(uid===ME.id) return showToast('Use Leave Squad for yourself','ti-alert-circle');
  const target=SQUAD.members.find(m=>m.id===uid); if(!target) return;
  if(roleOf(uid)==='owner') return showToast('The owner cannot be removed','ti-ban');
  if(ban && !can(ME.id,'manageRoles') && roleOf(uid)==='admin') return showToast('Only role managers can remove an admin','ti-ban');
  SQUAD.members=SQUAD.members.filter(m=>m.id!==uid);
  if(SQUAD.status) delete SQUAD.status[uid];
  if(SQUAD.roles) delete SQUAD.roles[uid];
  if(SQUAD.permissions) delete SQUAD.permissions[uid];
  if(SQUAD.joinRequests) SQUAD.joinRequests=SQUAD.joinRequests.filter(r=>r.id!==uid);
  if(ban){
    if(!Array.isArray(SQUAD.bannedIds)) SQUAD.bannedIds=[];
    if(!SQUAD.bannedIds.includes(uid)) SQUAD.bannedIds.push(uid);
  }
  SQUAD.updatedAt=Date.now();
  await saveSquad();
  // Clean up the removed user's own record so this squad stops showing up for them
  // (their groupIds list, and their squadId if this squad was their active one) —
  // otherwise their client still thinks they belong here (e.g. "leaves together"
  // symptoms, phantom membership counts) even though the squad's member list no
  // longer includes them.
  try{
    const removedUser = await window.fbGet('users/'+uid);
    if(removedUser){
      const nextGroupIds = Array.isArray(removedUser.groupIds) ? removedUser.groupIds.filter(id=>id!==SQUAD.id) : [];
      const patch = { groupIds: nextGroupIds };
      if(removedUser.squadId===SQUAD.id) patch.squadId = nextGroupIds[0]||null;
      await window.fbUpdate('users/'+uid, patch);
      await window.fbUpdate('users/'+uid+'/notifications/'+`group_removed_${SQUAD.id}`,{id:`group_removed_${SQUAD.id}`,type:ban?'group_banned':'group_removed',title:ban?'Removed and banned':'Removed from group',body:ban?`You were removed from ${SQUAD.name} and can no longer rejoin.`:`You were removed from ${SQUAD.name}.`,ts:Date.now(),read:false});
    }
  }catch(e){}
  softUpdate();
  showToast(ban?`${target.name.split(' ')[0]} removed and banned`:`${target.name.split(' ')[0]} removed`,'ti-user-minus');
}

  // fires after the hold completes.
  if(banBtn) banBtn.onclick = async () => { close(); await removeSquadMember(uid, {ban:true}); };
  initHoldToConfirm();
}

// ── TVBox / synchronized watch room ────────────────────────────────────────
// TVBox is intentionally YouTube-only for now. The official YouTube IFrame Player API
// provides the shared player while Firebase carries the authoritative room timeline,
// host commands, watcher presence, and drift correction.
const WATCH_SERVICES = [
  { id:'youtube', label:'YouTube', icon:'ti-brand-youtube', color:'#FF4D4D', mode:'youtube' },
];

function getWatchSource(url){
  const raw = String(url||'').trim();
  let youtubeId = '';
  try {
    const u = new URL(raw);
    const host = u.hostname.toLowerCase();
    if(host === 'youtu.be' || host.endsWith('.youtu.be')) youtubeId = u.pathname.split('/').filter(Boolean)[0] || '';
    if(host === 'youtube.com' || host.endsWith('.youtube.com')) {
      youtubeId = u.searchParams.get('v') ||
        (u.pathname.match(/\/embed\/([^/?]+)/)||[])[1] ||
        (u.pathname.match(/\/shorts\/([^/?]+)/)||[])[1] ||
        (u.pathname.match(/\/live\/([^/?]+)/)||[])[1] || '';
    }
  } catch(e){}
  return youtubeId ? {type:'youtube', id:youtubeId, url:raw} : {type:'invalid', url:raw};
}
function estimateWatchPosition(room){
  let pos = Number(room?.position || 0);
  if(room?.playing && room?.updatedAt && room?.positionTs) pos += Math.max(0, (Date.now()-room.positionTs)/1000);
  return Math.max(0,pos);
}
function loadYouTubeAPI(){
  if(window.YT && window.YT.Player) return Promise.resolve(window.YT);
  if(ytApiPromise) return ytApiPromise;
  ytApiPromise = new Promise((resolve,reject)=>{
    const old = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if(old) try{old();}catch(e){}; resolve(window.YT); };
    const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; s.async=true; s.onerror=()=>reject(new Error('YouTube API failed to load')); document.head.appendChild(s);
  });
  return ytApiPromise;
}
function destroyWatchPlayer(){
  clearInterval(watchPlayer.timer); watchPlayer.timer=null;
  clearInterval(watchPlayer.hostTimer); watchPlayer.hostTimer=null;
  try{ if(watchPlayer.instance && watchPlayer.type==='youtube') watchPlayer.instance.destroy(); }catch(e){}
  const host=document.getElementById('watch-player-host'); if(host) host.innerHTML='';
  watchPlayer={type:null,instance:null,roomId:null,applying:false,lastCommandTs:0,timer:null,hostTimer:null,lastObserved:0,lastObservedTs:0,lastBroadcastTs:0};
}
function watchPlayerPosition(){
  try{
    if(!watchPlayer.instance) return 0;
    if(watchPlayer.type==='youtube') return Number(watchPlayer.instance.getCurrentTime()||0);
    return 0;
  }catch(e){ return 0; }
}
async function publishWatchPatch(fields={}){
  if(!SQUAD?.watchParty || SQUAD.watchParty.hostId!==ME.id || isViewerMode()) return;
  const now=Date.now();
  Object.assign(SQUAD.watchParty, fields, {updatedAt:now});
  SQUAD.updatedAt=now;
  try{
    await window.fbUpdate('squads/'+SQUAD.id+'/watchParty', {...fields, updatedAt:now});
  }catch(e){ console.warn('Watch party sync failed',e); }
}
async function publishWatchCommand(action, position, extra={}){
  if(!SQUAD?.watchParty || SQUAD.watchParty.hostId!==ME.id || isViewerMode()) return;
  const pos=Math.max(0,Number(position)||0);
  const patch={action,playing:action==='play',position:pos,positionTs:Date.now(),...extra};
  await publishWatchPatch(patch);
}
async function initWatchPlayer(room){
  const host=document.getElementById('watch-player-host');
  if(!host || !room) return;
  const source=getWatchSource(room.link);
  if(source.type!=='youtube') return;
  if(watchPlayer.roomId===room.startedAt && watchPlayer.instance){ reconcileWatchPlayer(room); return; }
  destroyWatchPlayer();
  watchPlayer.roomId=room.startedAt;
  watchPlayer.lastObserved=0;
  watchPlayer.lastObservedTs=Date.now();
  host.innerHTML='<div id="watch-yt-player"></div>';
  try{
    await loadYouTubeAPI();
    if(!document.getElementById('watch-yt-player')) return;
    watchPlayer.type='youtube';
    watchPlayer.instance=new YT.Player('watch-yt-player',{
      width:'100%',height:'100%',videoId:source.id,
      playerVars:{autoplay:0,controls:1,playsinline:1,rel:0,modestbranding:1,enablejsapi:1,origin:location.origin},
      events:{
        onReady:()=>{
          reconcileWatchPlayer(SQUAD.watchParty);
          try{ watchPlayer.instance.setVolume(100); }catch(e){}
        },
        onStateChange:(e)=>{
          if(watchPlayer.applying || !SQUAD?.watchParty || SQUAD.watchParty.hostId!==ME.id || isViewerMode()) return;
          const pos=watchPlayerPosition();
          if(e.data===YT.PlayerState.PLAYING) publishWatchCommand('play',pos);
          else if(e.data===YT.PlayerState.PAUSED) publishWatchCommand('pause',pos);
          else if(e.data===YT.PlayerState.ENDED) publishWatchCommand('pause',0,{ended:true});
        }
      }
    });
  }catch(e){ showToast('YouTube player could not load — check the network connection','ti-alert-triangle'); return; }
  watchPlayer.timer=setInterval(()=>reconcileWatchPlayer(SQUAD?.watchParty),900);
  watchPlayer.hostTimer=setInterval(async()=>{
    const r=SQUAD?.watchParty;
    if(!r || r.hostId!==ME.id || isViewerMode() || !watchPlayer.instance) return;
    const now=Date.now(),pos=watchPlayerPosition(),last=watchPlayer.lastObserved,dt=Math.max(1,now-watchPlayer.lastObservedTs);
    const state=watchPlayer.instance.getPlayerState?.();
    const delta=pos-last;
    if(state===YT.PlayerState.PLAYING){
      const expected=dt/1000;
      const seeked=Math.abs(delta-expected)>2.2;
      if(seeked) await publishWatchCommand('seek',pos);
      else if(now-watchPlayer.lastBroadcastTs>1400) {
        await publishWatchPatch({position:pos,positionTs:now});
        watchPlayer.lastBroadcastTs=now;
      }
    }
    watchPlayer.lastObserved=pos;watchPlayer.lastObservedTs=now;
  },500);
}
async function reconcileWatchPlayer(room){
  if(!room||room.service!=='youtube'||watchPlayer.roomId!==room.startedAt||!watchPlayer.instance)return;
  const target=estimateWatchPosition(room),cur=watchPlayerPosition(),delta=target-cur,hard=Math.abs(delta)>1.8,soft=Math.abs(delta)>0.35;
  watchPlayer.applying=true;
  try{
    if(hard) watchPlayer.instance.seekTo(target,true);
    const state=watchPlayer.instance.getPlayerState();
    if(room.playing && state!==YT.PlayerState.PLAYING){
      try{ await watchPlayer.instance.playVideo(); }catch(e){
        const badge=document.getElementById('watch-autoplay-hint'); if(badge) badge.classList.add('show');
      }
    }
    if(!room.playing && state===YT.PlayerState.PLAYING) watchPlayer.instance.pauseVideo();
    updateWatchSyncBadge(soft?'resyncing':'synced',Math.abs(delta));
    watchPlayer.lastCommandTs=room.updatedAt||Date.now();
  }catch(e){ updateWatchSyncBadge('error',Math.abs(delta)); }
  finally{ setTimeout(()=>watchPlayer.applying=false,140); }
}
async function enableWatchPlayback(){
  if(!SQUAD?.watchParty || !watchPlayer.instance || watchPlayer.type!=='youtube') return;
  try{
    const target=estimateWatchPosition(SQUAD.watchParty);

    if(SQUAD.watchParty.playing) await watchPlayer.instance.playVideo();
    const hint=document.getElementById('watch-autoplay-hint'); if(hint) hint.classList.remove('show');
  }catch(e){ showToast('Tap the YouTube player once to enable playback','ti-hand-click'); }
}

};

// ── Trivia ───────────────────────────────────────────────────────────────
// Fetches a question from Open Trivia DB (opentdb.com \u2014 free, no API key)
// and stores the round + everyone's answers on the squad record so the
// whole group plays the same question together in real time. Falls back
// to a small local question bank if the API is unreachable.
const TRIVIA_FALLBACK = [
  { question:'What planet is known as the Red Planet?', correct:'Mars', options:['Mars','Venus','Jupiter','Saturn'] },
  { question:'How many continents are there on Earth?', correct:'7', options:['5','6','7','8'] },
  { question:'What is the largest ocean on Earth?', correct:'Pacific Ocean', options:['Atlantic Ocean','Pacific Ocean','Indian Ocean','Arctic Ocean'] },
  { question:'Which element has the chemical symbol "O"?', correct:'Oxygen', options:['Gold','Oxygen','Osmium','Silver'] },
  { question:'What is the smallest prime number?', correct:'2', options:['0','1','2','3'] },
];
function shuffleArr(a){ const arr=a.slice(); for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function decodeHtmlEntities(s){ const t = document.createElement('textarea'); t.innerHTML = s; return t.value; }

async function fetchTriviaQuestion(){
  try{
    const res = await fetch('https://opentdb.com/api.php?amount=1&type=multiple');
    if(!res.ok) throw new Error('bad response');
    const data = await res.json();
    const q = data.results && data.results[0];
    if(!q) throw new Error('no question');
    return {
      question: decodeHtmlEntities(q.question),
      correct: decodeHtmlEntities(q.correct_answer),
      options: shuffleArr([q.correct_answer, ...q.incorrect_answers].map(decodeHtmlEntities)),
    };
  }catch(e){
    const pick = TRIVIA_FALLBACK[Math.floor(Math.random()*TRIVIA_FALLBACK.length)];
    return { question: pick.question, correct: pick.correct, options: shuffleArr(pick.options) };
  }
}

  if(!can(ME.id,'startActivities')){ showToast('You cannot start activities', 'ti-ban'); return; }
  const q = await fetchTriviaQuestion();
