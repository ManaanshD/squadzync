    };
  }
  if(byId('gs-copy-invite')) byId('gs-copy-invite').onclick=async()=>{const link=safeInviteLink(SQUAD.code);try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(link);else{const ta=document.createElement('textarea');ta.value=link;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}showToast('Invite link copied','ti-copy')}catch(e){showToast('Copy failed — use Share instead','ti-alert-triangle')}};
  if(byId('gs-share-invite')) byId('gs-share-invite').onclick=()=>openGroupInviteDialog();
  if(byId('gs-qr-invite')) byId('gs-qr-invite').onclick=()=>openQrDialog(safeInviteLink(SQUAD.code),SQUAD.name);
  if(byId('gs-regenerate-invite')) byId('gs-regenerate-invite').onclick=async()=>{
    if(viewerBlocked() || !can(ME.id,'editGroupSettings')) return;
    const expiryMs=Number(byId('gs-invite-expiry')?.value||0);
    SQUAD.code=genCode(); SQUAD.inviteRegeneratedAt=Date.now(); SQUAD.inviteExpiresAt=expiryMs>0?Date.now()+expiryMs:null; SQUAD.updatedAt=Date.now();
    const saved=await saveSquad(); if(!saved) return; showToast('Invite code regenerated','ti-refresh'); softUpdate();
  };
  if(byId('gs-generate-palette')) byId('gs-generate-palette').onclick=()=>{
    if(viewerBlocked() || !can(ME.id,'editGroupSettings')) return;
    const [a,b,bg]=groupPaletteFromSeed((byId('gs-logo')?.value||SQUAD.name||'SquadZync').trim());
    byId('gs-accent').value=a; byId('gs-accent2').value=b; byId('gs-background').value=bg; showToast('Palette generated','ti-palette');
  };
  document.querySelectorAll('[data-role-select]').forEach(sel => {
    sel.onchange = async () => {
      if(!can(ME.id,'manageRoles')){ showToast('You cannot manage roles', 'ti-ban'); sel.value = roleOf(sel.dataset.roleSelect); return; }
      const uid = sel.dataset.roleSelect;
      const newRole = sel.value;
      if(!SQUAD.roles) SQUAD.roles = {};
      SQUAD.roles[uid] = newRole;
      if(!SQUAD.permissions) SQUAD.permissions = {};
      SQUAD.permissions[uid] = { ...DEFAULT_PERMISSIONS[newRole] };
      SQUAD.updatedAt = Date.now();
      const saved=await saveSquad();
      if(!saved) return;
      softUpdate();
      showToast(`Role updated`, 'ti-shield');
    };
  });
  document.querySelectorAll('[data-perm-toggle]').forEach(chip => {
    chip.onclick = async () => {
      if(!can(ME.id,'manageRoles')){ showToast('You cannot manage permissions', 'ti-ban'); return; }
      const [uid, permId] = chip.dataset.permToggle.split(':');
      if(!SQUAD.permissions) SQUAD.permissions = {};
      if(!SQUAD.permissions[uid]) SQUAD.permissions[uid] = { ...DEFAULT_PERMISSIONS[roleOf(uid)] };
      SQUAD.permissions[uid][permId] = !SQUAD.permissions[uid][permId];
      SQUAD.updatedAt = Date.now();
      const saved=await saveSquad();
      if(!saved) return;
      softUpdate();
    };
  });

  if(byId('go-customize')) byId('go-customize').onclick = () => goTo('customize');
  document.querySelectorAll('[data-theme]').forEach(sw=>{
    sw.onclick = async () => {
      LOCAL.theme = sw.dataset.theme;
      LOCAL.accentHex = '';
      await saveLocal();
      softUpdate();
    };
  });
  document.querySelectorAll('[data-layout-choice]').forEach(row=>{
    row.onclick = async () => {
      LOCAL.layout = row.dataset.layoutChoice;
      await saveLocal();
      softUpdate();
    };
  });
  document.querySelectorAll('[data-density-choice]').forEach(row=>{
    row.onclick = async () => {
      LOCAL.density = row.dataset.densityChoice;
      await saveLocal();
      softUpdate();
    };
  });
  if(byId('custom-density')) byId('custom-density').onchange=async e=>{LOCAL.density=e.target.value;await saveLocal();softUpdate();};
  if(byId('custom-glass-blur')) byId('custom-glass-blur').onchange=async e=>{LOCAL.glassBlur=Number(e.target.value)||26;await saveLocal();applyTheme();};
  if(byId('custom-parallax-strength')) byId('custom-parallax-strength').onchange=async e=>{LOCAL.parallaxStrength=e.target.value;await saveLocal();};
  if(byId('custom-interaction')) byId('custom-interaction').onchange=async e=>{LOCAL.buttonStretch=e.target.value==='true';await saveLocal();};
  if(byId('parallax-toggle')) byId('parallax-toggle').onclick=async()=>{LOCAL.parallax=LOCAL.parallax===false;await saveLocal();softUpdate();};
  if(byId('tilt-toggle')) byId('tilt-toggle').onclick=async()=>{LOCAL.tilt=LOCAL.tilt===false;await saveLocal();softUpdate();};
  if(byId('page-transitions-toggle')) byId('page-transitions-toggle').onclick=async()=>{LOCAL.pageTransitions=LOCAL.pageTransitions===false;await saveLocal();};
  if(byId('reduce-motion-toggle')){
    byId('reduce-motion-toggle').onclick = async () => {
      LOCAL.reduceMotion = !LOCAL.reduceMotion;
      await saveLocal();
      softUpdate();
    };
  }
  if(byId('custom-accent-swatch')){
    byId('custom-accent-swatch').onclick = () => byId('custom-accent-input').click();
    // 'input' fires continuously while dragging inside the native color
    // picker — apply the live color immediately via CSS vars (cheap, no
    // re-render) but only persist + soft-update the DOM once the user
    // actually lets go ('change'), so the screen doesn't rebuild mid-drag.
    byId('custom-accent-input').addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--accent', e.target.value);
      document.documentElement.style.setProperty('--accent-2', shiftHex(e.target.value, 24));
      document.documentElement.style.setProperty('--accent-rgb', hexToRgb(e.target.value) || '124,156,255');
      const sw=document.getElementById('custom-accent-swatch'); if(sw) sw.style.background=e.target.value;
    });
    byId('custom-accent-input').addEventListener('change', async (e) => {
      LOCAL.accentHex = e.target.value;
      await saveLocal();
      softUpdate();
    });
  }

  if(byId('me-save-btn')){
    byId('me-save-btn').onclick = async () => {
      const name = byId('me-name-input').value.trim();
      if(!name) return showToast('Name cannot be empty', 'ti-alert-circle');
      ME.name = name;
      ME.tz = byId('me-tz-input').value;
      await saveMe();
      if(SQUAD){
        const m = SQUAD.members.find(x=>x.id===ME.id);
        if(m){ m.name = ME.name; m.tz = ME.tz; SQUAD.updatedAt = Date.now(); await saveSquad(); }
      }
      showToast('Profile saved', 'ti-check');
      renderAll();
    };
  }

  if(byId('me-signout-btn')){
    byId('me-signout-btn').onclick = async () => {
      if(squadUnsub) squadUnsub();
      if(boardUnsub) boardUnsub();
      if(nudgeUnsub) nudgeUnsub();
      if(chatUnsub) chatUnsub();
      if(callUnsub) callUnsub();
      await window.fbSignOut();
      if(notificationUnsub) notificationUnsub(); notificationUnsub=null; USER_NOTIFICATIONS={}; notificationSeenIds.clear();
      ME = null; SQUAD = null; SQUAD_ID = null; history_stack = [];
      goTo('login', {replace:true});
    };
  }
  // Viewer fallback: controls that are not explicitly navigation-safe and are not
  // already wired with an onclick handler get a clear explanation instead of silently doing nothing.
  document.querySelectorAll('button, .icon-btn, .fab, .nudge-btn').forEach(el=>{
    if(el.dataset.viewerFallback==='1') return;
    el.dataset.viewerFallback='1';
    const safe = el.id && /^(nav-|.*back$|.*-back$|shop-back$)/.test(el.id) || el.matches('.nav-item,.layout-opt,.social-tab,[data-switch-group],[data-xp-tab]');
    if(safe) return;
    if(typeof el.onclick === 'function' || el.dataset.viewerWrite==='1') return;
    el.addEventListener('click',()=>{ if(isViewerMode()) showToast('Viewer Mode is read-only — sign in to use this action','ti-lock'); });
  });
}

function positionLayoutPill(){
  const wrap = document.getElementById('layout-switch');
  const pill = document.getElementById('layout-pill');
  if(!wrap || !pill) return;
  const active = wrap.querySelector('.layout-opt.active');
  if(!active) return;
  pill.style.left = active.offsetLeft + 'px';
  pill.style.width = active.offsetWidth + 'px';
}

setInterval(()=>{ if(['home','board'].includes(currentScreen)) renderAll(false); }, 30000);

function checkFirebaseConfigured(){
  if(window.__fbReady === false){
    const b = document.createElement('div');
    b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999;background:#F87171;color:#1a0000;font-family:sans-serif;font-size:12.5px;font-weight:700;text-align:center;padding:10px 16px;';
    b.textContent = 'Firebase is not reachable — check your connection or Firebase project settings.';
    document.body.prepend(b);
  }
}

(function initSyncAndErrorUX(){if(window.__syncUXBound)return;window.__syncUXBound=true;window.addEventListener('squadzync:firebase-error',e=>{if(typeof showToast==='function')showToast(e.detail?.error?.code==='PERMISSION_DENIED'?'You do not have permission for that action.':'Couldn’t save that change.','ti-alert-triangle')});window.addEventListener('squadzync:sync-state',e=>{const el=document.getElementById('global-sync-state');if(!el)return;const d=e.detail||{};el.textContent=d.state==='offline'?`OFFLINE${d.count?` · ${d.count} queued`:''}`:d.state==='syncing'?'SYNCING…':d.state==='error'?'SYNC ERROR':'LIVE';el.classList.toggle('offline',d.state!=='live')});window.addEventListener('online',()=>{if(window.__pendingMutationCount?.()&&typeof showToast==='function')showToast('Connection restored — syncing changes','ti-refresh');window.__flushFirebaseQueue?.()});window.addEventListener('offline',()=>{if(typeof showToast==='function')showToast('You’re offline — changes will be queued','ti-cloud-off')})})();

function showLoading(){
  document.getElementById('app').innerHTML = `<div class="loading-wrap"><div class="spinner"></div><p style="color:var(--text-lo);font-size:13px;">Loading SquadZync...</p></div>`;
}

async function bootForUser(user){
  if(isViewerMode()) return;
  if(!user){
    ME = null; SQUAD = null; SQUAD_ID = null; history_stack = [];
    currentScreen = 'login';
    renderAll();
    return;
  }
  await loadMe();
  await loadLocal();
  if(ME) attachUserNotificationListener();
  await loadMySquadId();
  applyTheme();

  if(!ME){ currentScreen = 'onboard'; renderAll(); return; }
  if(!SQUAD_ID){ currentScreen = 'squad-choice'; renderAll(); return; }

  const s = await loadSquad(SQUAD_ID);
  if(!s){ currentScreen = 'squad-choice'; SQUAD_ID = null; renderAll(); return; }
  const meInSquad = s.members.find(m=>m.id===ME.id);
  if(meInSquad){ meInSquad.name = ME.name; meInSquad.tz = ME.tz; meInSquad.photo = ME.photo || ''; }
  SQUAD = s;
  recordSquadSyncBase();
  await touchGroupStreak();
  if(!SQUAD.groupStyle) SQUAD.groupStyle=defaultGroupStyle(); else SQUAD.groupStyle={...defaultGroupStyle(),...SQUAD.groupStyle};
  currentScreen = 'home';
  await initXpOnBoot();
  renderAll();
  attachSquadListener();
  initBatteryTracking();
}

function waitForFbBridge(timeoutMs = 4000){
  return new Promise(resolve => {
    if (window.__fbBridgeReady) return resolve(true);
    const timer = setTimeout(() => { window.__onFbBridgeReady = null; resolve(false); }, timeoutMs);
    window.__onFbBridgeReady = () => { clearTimeout(timer); resolve(true); };
  });
}

function markPlatform(){const ua=navigator.userAgent||'';if(/Safari/i.test(ua)&&!/Chrome|Chromium|CriOS|Android/i.test(ua))document.documentElement.classList.add('ios-safari')}markPlatform();

async function boot(){
  try{ const h=location.hash.match(/^#join=(.+)$/); if(h) window.__pendingInviteCode=decodeURIComponent(h[1]); }catch(e){}
  showLoading();
  // Wait for the Firebase bridge module (window.fbSet/fbGet/etc.) to finish
  // attaching before touching anything that calls it — this is what fixes
  // the "window.fbSet is not a function" sync error on cold loads.
  const bridgeOk = await waitForFbBridge();
  window.__flushFirebaseQueue?.();
  if (!bridgeOk) window.__fbReady = false;
  checkFirebaseConfigured();
  if(!window.__authReady){
    window.__authUser = { uid: 'local_' + (localStorage.getItem('squadsync:local_uid') || (()=>{ const id='local_'+Math.random().toString(36).slice(2,10); localStorage.setItem('squadsync:local_uid', id); return id; })()), name:'You', email:'', photo:'' };
    await bootForUser(window.__authUser);
    return;
  }
  window.__onAuthChange = (user) => { bootForUser(user); };
  window.__onAuthReady((user) => { bootForUser(user); });
}

boot();

(function(){
  const manifest = {
    name: "SquadZync", short_name: "SquadZync", start_url: "./", display: "standalone",
    background_color: "#0B0E1A", theme_color: "#0B0E1A",
    icons: [{ src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237C9CFF'/%3E%3Cpath d='M30 55 L45 68 L72 35' stroke='%230B0E1A' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E", sizes:"100x100", type:"image/svg+xml" }]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  document.getElementById('manifest-link').setAttribute('href', URL.createObjectURL(blob));
})();
</script>
